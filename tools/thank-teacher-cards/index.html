<!doctype html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="在瀏覽器本機整理謝師恩文章、核對收稿張數、批改及製作感恩卡。">

  <link rel="stylesheet" href="styles.css">

  <script src="https://unpkg.com/pizzip@3.2.0/dist/pizzip.js"></script>

<body>
  <div class="le-app-shell">
    <header class="le-topbar">
      <div class="le-brand-mark" aria-hidden="true">謝</div>

    <main id="leApp" class="le-page" aria-live="polite">
      <div class="le-loading"><span class="le-spinner"></span><b>正在載入本機記錄…</b></div>
    </main>
  <footer class="le-footer">學生文章和記錄保存在目前瀏覽器；請定期下載 JSON 備份。只有按下 MiniMax OCR 時，所選影像才會直接傳送至 MiniMax。正式姓名、老師稱謂及不清楚字句須由校方／學生確認。</footer>
  </div>
  <script src="template.js"></script>
  <script src="app.js" defer></script>
