<!DOCTYPE html>
<html lang="zh-HK" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="1 至 100 循環的極簡籌號叫號系統。">
  <title>極簡籌號系統 (1-100循環)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .animate-glow { text-shadow: 0 0 35px rgba(59, 130, 246, 0.45); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center items-center p-3 sm:p-4 selection:bg-blue-500 selection:text-white overflow-x-hidden">
  <div class="w-full max-w-md md:max-w-2xl lg:max-w-4xl my-auto flex flex-col justify-center gap-3 md:gap-4 py-2">
    <header class="w-full px-2 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-3 h-3 rounded-full bg-blue-500 animate-pulse"></div>
        <h1 class="text-sm md:text-base font-bold tracking-wider text-slate-300 uppercase">極簡籌號系統</h1>
        <span class="text-xs bg-blue-500/20 text-blue-300 border border-blue-500/40 px-2.5 py-0.5 rounded-full font-mono font-bold tracking-wide shadow-sm shadow-blue-500/10">1–100 循環模式</span>
      </div>
      <button onclick="toggleAudio()" id="audio-toggle-btn" class="px-3 py-1.5 rounded-full bg-slate-900 border border-slate-800 text-xs text-slate-300 hover:border-slate-700 transition-all flex items-center gap-1.5 shadow-sm" title="切換語音狀態">
        <i id="audio-icon" class="fa-solid fa-volume-high text-blue-400"></i>
        <span id="audio-status-text">語音已開啟</span>
      </button>
    </header>

    <main class="w-full">
      <div class="bg-slate-900/90 backdrop-blur-md rounded-3xl p-4 sm:p-6 md:p-8 border border-slate-800/80 shadow-2xl shadow-blue-950/30 relative overflow-hidden">
        <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-blue-600 via-indigo-500 to-cyan-400"></div>

        <div class="text-center my-1 md:my-2 cursor-pointer group" onclick="openEditModal('calling')" title="點擊直接修改當前叫號">
          <div class="inline-flex items-center justify-center gap-2 mb-1">
            <span class="text-xs sm:text-sm font-bold tracking-widest text-slate-400 uppercase">目前叫號</span>
            <span class="text-xs sm:text-sm text-blue-300 font-mono font-bold bg-blue-950/80 px-3 py-0.5 rounded-full border border-blue-800/60 shadow-inner">1–100 循環</span>
            <i class="fa-solid fa-pen text-xs text-slate-500 group-hover:text-blue-400 transition-colors ml-1"></i>
          </div>
          <div class="text-7xl sm:text-[9.5rem] md:text-[11.5rem] font-black text-blue-400 font-mono tracking-tight leading-none my-1 md:my-2 animate-glow transition-transform active:scale-95 py-1 select-none">
            <span id="current-calling-display">10</span>
          </div>
          <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-slate-950/70 border border-slate-800 text-xs sm:text-sm text-slate-300 font-mono">
            <i class="fa-regular fa-clock text-blue-400"></i>
            <span>最後叫號：<span id="last-time-display" class="font-bold text-slate-200">--:--:--</span></span>
          </div>
        </div>

        <div class="grid grid-cols-4 gap-2.5 md:gap-4 my-4 md:my-5">
          <button onclick="callPrevious()" class="py-3 md:py-4 px-2 rounded-2xl bg-slate-800 hover:bg-slate-700 active:scale-95 transition-all text-slate-200 font-semibold text-xs md:text-sm flex flex-col md:flex-row items-center justify-center gap-1.5 border border-slate-700/50 shadow-md">
            <i class="fa-solid fa-chevron-left text-sm md:text-base text-slate-400"></i><span>叫上號</span>
          </button>
          <button onclick="reannounce()" class="py-3 md:py-4 px-2 rounded-2xl bg-slate-800 hover:bg-slate-700 active:scale-95 transition-all text-slate-200 font-semibold text-xs md:text-sm flex flex-col md:flex-row items-center justify-center gap-1.5 border border-slate-700/50 shadow-md">
            <i class="fa-solid fa-rotate-right text-sm md:text-base text-blue-400"></i><span>重廣播</span>
          </button>
          <button onclick="markMissed()" class="py-3 md:py-4 px-2 rounded-2xl bg-slate-800 hover:bg-amber-500/20 active:scale-95 transition-all text-amber-300 font-semibold text-xs md:text-sm flex flex-col md:flex-row items-center justify-center gap-1.5 border border-amber-500/30 hover:border-amber-500/60 shadow-md">
            <i class="fa-solid fa-user-xmark text-sm md:text-base text-amber-400"></i><span>未回應</span>
          </button>
          <button onclick="callNext()" class="py-3 md:py-4 px-2 rounded-2xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 active:scale-95 transition-all text-white font-bold text-xs md:text-sm flex flex-col md:flex-row items-center justify-center gap-1.5 shadow-lg shadow-blue-600/30 border border-blue-400/30">
            <i class="fa-solid fa-chevron-right text-sm md:text-base"></i><span>叫下號</span>
          </button>
        </div>

        <div class="grid grid-cols-3 gap-2.5 md:gap-4 pt-3 md:pt-4 border-t border-slate-800/80 text-xs md:text-sm">
          <div class="bg-slate-950/60 p-3 rounded-2xl border border-slate-800/60 hover:border-slate-700 transition-colors relative group flex flex-col justify-between">
            <div class="text-slate-400 mb-1 flex items-center justify-between text-xs">
              <span class="cursor-pointer font-medium" onclick="openEditModal('total')">派籌進度</span>
              <button onclick="event.stopPropagation(); issueTicket(1);" title="點擊派籌 +1" class="px-2 py-0.5 rounded-md bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs flex items-center justify-center transition-all active:scale-90 border border-blue-400/30 shadow">+1</button>
            </div>
            <div class="text-base sm:text-lg md:text-xl font-extrabold text-slate-200 font-mono cursor-pointer mt-0.5" onclick="openEditModal('total')">至 <span id="total-issued-display" class="text-blue-400">79</span> 號</div>
          </div>
          <div class="bg-slate-950/60 p-3 rounded-2xl border border-slate-800/60 flex flex-col justify-between">
            <div class="text-slate-400 font-medium mb-1 text-xs">尚在等候</div>
            <div class="text-base sm:text-lg md:text-xl font-extrabold text-emerald-400 font-mono mt-0.5"><span id="waiting-count-display">69</span> 人</div>
          </div>
          <div onclick="openMissedModal()" class="bg-slate-950/60 p-3 rounded-2xl border border-slate-800/60 hover:border-amber-500/40 cursor-pointer transition-colors flex flex-col justify-between group">
            <div class="text-slate-400 font-medium mb-1 text-xs flex items-center justify-between"><span>未有回應</span><i class="fa-solid fa-chevron-right text-[10px] text-slate-600 group-hover:text-amber-400"></i></div>
            <div class="text-base sm:text-lg md:text-xl font-extrabold text-amber-400 font-mono mt-0.5"><span id="missed-count-display">0</span> 人</div>
          </div>
        </div>

        <div class="mt-3 md:mt-4 pt-2.5 md:pt-3 border-t border-slate-800/50 flex items-center justify-between text-xs text-slate-400">
          <button onclick="openHistoryModal()" class="hover:text-blue-400 transition-colors flex items-center gap-1.5 px-2.5 py-1 rounded-lg hover:bg-slate-800/60"><i class="fa-solid fa-clock-rotate-left"></i><span>叫號紀錄</span></button>
          <button onclick="openMissedModal()" class="hover:text-amber-400 transition-colors flex items-center gap-1.5 px-2.5 py-1 rounded-lg hover:bg-slate-800/60"><i class="fa-solid fa-user-xmark text-amber-400"></i><span>過號名單 (<span id="toolbar-missed-count">0</span>)</span></button>
          <button onclick="openEditModal('both')" class="hover:text-blue-400 transition-colors flex items-center gap-1.5 px-2.5 py-1 rounded-lg hover:bg-slate-800/60"><i class="fa-solid fa-sliders"></i><span>調整數值</span></button>
        </div>
      </div>
    </main>

    <footer class="w-full px-2 text-center text-xs text-slate-500">
      快捷鍵：<span class="text-slate-300 font-mono">空白鍵</span> (叫下一號) | <span class="text-slate-300 font-mono">← 方向鍵</span> (叫上號) | <span class="text-slate-300 font-mono">M 鍵</span> (記未回應) | <span class="text-slate-300 font-mono">R 鍵</span> (重廣播) | <span class="text-slate-300 font-mono">+ 鍵</span> (派籌+1)
    </footer>
  </div>

  <div id="edit-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-sm shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-base font-bold text-slate-100 flex items-center gap-2"><i class="fa-solid fa-sliders text-blue-400"></i><span>修改籌號數值 (1-100)</span></h3>
        <button onclick="closeModal('edit-modal')" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div class="space-y-3.5">
        <div><label class="block text-xs font-semibold text-slate-400 mb-1">當前叫號 (1–100)</label><input type="number" id="input-calling" min="1" max="100" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-slate-100 font-mono text-lg focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"></div>
        <div><label class="block text-xs font-semibold text-slate-400 mb-1">派籌進度總計 (1–100)</label><input type="number" id="input-total" min="1" max="100" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-slate-100 font-mono text-lg focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"></div>
      </div>
      <div class="flex gap-2 pt-2">
        <button onclick="closeModal('edit-modal')" class="w-1/2 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs transition-colors">取消</button>
        <button onclick="saveNumberEdits()" class="w-1/2 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs transition-colors shadow-lg shadow-blue-600/30">儲存設定</button>
      </div>
    </div>
  </div>

  <div id="history-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-md shadow-2xl flex flex-col max-h-[80vh]">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-3"><h3 class="text-base font-bold text-slate-100 flex items-center gap-2"><i class="fa-solid fa-clock-rotate-left text-blue-400"></i><span>叫號時間紀錄</span></h3><button onclick="closeModal('history-modal')" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark text-lg"></i></button></div>
      <div id="history-list" class="flex-1 overflow-y-auto space-y-2 my-2 pr-1 text-xs"></div>
      <div class="flex gap-2 pt-3 border-t border-slate-800"><button onclick="clearHistory()" class="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-red-500/20 text-red-300 font-semibold text-xs transition-colors border border-red-500/30">清除所有紀錄</button></div>
    </div>
  </div>

  <div id="missed-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-md shadow-2xl flex flex-col max-h-[80vh]">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-3"><h3 class="text-base font-bold text-amber-300 flex items-center gap-2"><i class="fa-solid fa-user-xmark text-amber-400"></i><span>未有回應（過號）名單</span></h3><button onclick="closeModal('missed-modal')" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark text-lg"></i></button></div>
      <div id="missed-list" class="flex-1 overflow-y-auto space-y-2 my-2 pr-1 text-xs"></div>
      <div class="flex gap-2 pt-3 border-t border-slate-800"><button onclick="closeModal('missed-modal')" class="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs transition-colors">關閉</button></div>
    </div>
  </div>

  <script>
    let currentCalling = 10;
    let totalIssued = 79;
    let lastCallTime = "--:--:--";
    let audioEnabled = true;
    let callHistory = [];
    let missedTickets = [];
    let audioCtx = null;
    const MIN_NUM = 1;
    const MAX_NUM = 100;

    function getNextInCycle(num) { return num >= MAX_NUM ? MIN_NUM : num + 1; }
    function getPrevInCycle(num) { return num <= MIN_NUM ? MAX_NUM : num - 1; }
    function getWaitingCount() {
      return totalIssued >= currentCalling ? totalIssued - currentCalling : (MAX_NUM - currentCalling) + totalIssued;
    }
    function getFormattedTime() { return new Date().toTimeString().split(' ')[0]; }
    function updateDisplay() {
      document.getElementById('current-calling-display').innerText = currentCalling;
      document.getElementById('total-issued-display').innerText = totalIssued;
      document.getElementById('waiting-count-display').innerText = getWaitingCount();
      document.getElementById('last-time-display').innerText = lastCallTime;
      document.getElementById('missed-count-display').innerText = missedTickets.length;
      document.getElementById('toolbar-missed-count').innerText = missedTickets.length;
    }

    function playChime() {
      if (!audioEnabled) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(659.25, now);
        gain1.gain.setValueAtTime(0.3, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.4);
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(880, now + 0.18);
        gain2.gain.setValueAtTime(0.3, now + 0.18);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.18);
        osc2.stop(now + 0.7);
      } catch (error) {
        console.error('Audio playback error:', error);
      }
    }

    function speakNumber(num) {
      if (!audioEnabled) return;
      playChime();
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance('請 ' + num + ' 號');
        msg.lang = 'zh-HK';
        msg.rate = 0.95;
        setTimeout(function () { window.speechSynthesis.speak(msg); }, 350);
      }
    }

    function callNext() {
      currentCalling = getNextInCycle(currentCalling);
      lastCallTime = getFormattedTime();
      callHistory.unshift({ time: lastCallTime, ticket: currentCalling, action: '叫號' });
      updateDisplay();
      speakNumber(currentCalling);
    }
    function callPrevious() {
      currentCalling = getPrevInCycle(currentCalling);
      lastCallTime = getFormattedTime();
      callHistory.unshift({ time: lastCallTime, ticket: currentCalling, action: '退回叫號' });
      updateDisplay();
      speakNumber(currentCalling);
    }
    function reannounce() {
      lastCallTime = getFormattedTime();
      callHistory.unshift({ time: lastCallTime, ticket: currentCalling, action: '重廣播' });
      updateDisplay();
      speakNumber(currentCalling);
    }
    function markMissed() {
      const missedNum = currentCalling;
      if (!missedTickets.includes(missedNum)) missedTickets.push(missedNum);
      callHistory.unshift({ time: getFormattedTime(), ticket: missedNum, action: '標記未回應' });
      callNext();
    }
    function issueTicket(count) {
      for (let i = 0; i < (count || 1); i += 1) totalIssued = getNextInCycle(totalIssued);
      updateDisplay();
    }
    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function openEditModal() {
      document.getElementById('input-calling').value = currentCalling;
      document.getElementById('input-total').value = totalIssued;
      openModal('edit-modal');
    }
    function saveNumberEdits() {
      const callingInput = parseInt(document.getElementById('input-calling').value, 10);
      const totalInput = parseInt(document.getElementById('input-total').value, 10);
      if (!Number.isNaN(callingInput) && callingInput >= MIN_NUM && callingInput <= MAX_NUM) currentCalling = callingInput;
      if (!Number.isNaN(totalInput) && totalInput >= MIN_NUM && totalInput <= MAX_NUM) totalIssued = totalInput;
      lastCallTime = getFormattedTime();
      callHistory.unshift({ time: lastCallTime, ticket: currentCalling, action: '手動修改數值' });
      closeModal('edit-modal');
      updateDisplay();
    }

    function openHistoryModal() {
      const listEl = document.getElementById('history-list');
      if (callHistory.length === 0) {
        listEl.innerHTML = '<p class="text-slate-500 text-center py-6">暫無叫號紀錄</p>';
      } else {
        listEl.innerHTML = callHistory.map(function (item) {
          return '<div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-950/70 border border-slate-800/60"><div class="flex items-center gap-2"><span class="font-mono text-blue-400 font-bold text-sm">#' + item.ticket + '</span><span class="text-slate-300 font-medium">' + item.action + '</span></div><span class="font-mono text-slate-500 text-[11px]">' + item.time + '</span></div>';
        }).join('');
      }
      openModal('history-modal');
    }
    function clearHistory() {
      callHistory = [];
      openHistoryModal();
    }
    function openMissedModal() {
      const listEl = document.getElementById('missed-list');
      if (missedTickets.length === 0) {
        listEl.innerHTML = '<p class="text-slate-500 text-center py-6">尚無未回應號碼</p>';
      } else {
        listEl.innerHTML = missedTickets.map(function (num) {
          return '<div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-950/70 border border-slate-800/60"><span class="font-mono text-amber-400 font-bold text-base">號碼 #' + num + '</span><div class="flex items-center gap-2"><button onclick="recallMissed(' + num + ')" class="px-2.5 py-1 rounded-lg bg-blue-600/80 hover:bg-blue-600 text-white font-semibold text-xs transition-colors">重叫</button><button onclick="removeMissed(' + num + ')" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs transition-colors">已處理</button></div></div>';
        }).join('');
      }
      openModal('missed-modal');
    }
    function recallMissed(num) {
      currentCalling = num;
      lastCallTime = getFormattedTime();
      callHistory.unshift({ time: lastCallTime, ticket: num, action: '重叫過號' });
      updateDisplay();
      closeModal('missed-modal');
      speakNumber(num);
    }
    function removeMissed(num) {
      missedTickets = missedTickets.filter(function (ticket) { return ticket !== num; });
      updateDisplay();
      openMissedModal();
    }
    function toggleAudio() {
      audioEnabled = !audioEnabled;
      const statusText = document.getElementById('audio-status-text');
      const icon = document.getElementById('audio-icon');
      if (audioEnabled) {
        statusText.innerText = '語音已開啟';
        icon.className = 'fa-solid fa-volume-high text-blue-400';
      } else {
        statusText.innerText = '靜音模式';
        icon.className = 'fa-solid fa-volume-xmark text-slate-500';
      }
    }
    document.addEventListener('keydown', function (event) {
      if (event.target.tagName === 'INPUT') return;
      if (event.code === 'Space') {
        event.preventDefault();
        callNext();
      } else if (event.code === 'ArrowLeft') {
        event.preventDefault();
        callPrevious();
      } else if (event.code === 'KeyR') {
        reannounce();
      } else if (event.code === 'KeyM') {
        markMissed();
      } else if (event.key === '+' || event.code === 'NumpadAdd') {
        issueTicket(1);
      }
    });
    window.onload = function () {
      lastCallTime = getFormattedTime();
      updateDisplay();
    };
  </script>
</body>
</html>
