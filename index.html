<!doctype html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>教師人力與行政架構工具</title>
  <style>
    :root { color-scheme: light; --ink:#162537; --muted:#667587; --gold:#d99b22; --line:#dce3e9; --canvas:#f4f6f8; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:var(--canvas); font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; line-height:1.6; }
    main { width:min(760px, calc(100% - 32px)); margin:0 auto; padding:48px 0 64px; }
    header { padding:26px 28px; color:white; background:linear-gradient(115deg,#0e2941,#1b4868); border-bottom:4px solid var(--gold); border-radius:16px 16px 0 0; }
    header p { margin:0 0 4px; color:#bcd0df; font-size:12px; letter-spacing:.14em; }
    h1 { margin:0; font-size:clamp(25px,5vw,38px); }
    section { padding:28px; background:white; border:1px solid var(--line); border-top:0; border-radius:0 0 16px 16px; box-shadow:0 12px 32px rgba(16,42,67,.07); }
    h2 { margin:0 0 8px; font-size:21px; }
    p { color:var(--muted); }
    .intro { margin:0 0 22px; }
    .launch-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin:18px 0; }
    .launch { display:block; height:100%; padding:18px 20px; color:var(--ink); text-decoration:none; background:#fffaf0; border:1px solid #e6c979; border-left:5px solid var(--gold); border-radius:12px; }
    .launch:hover, .launch:focus-visible { outline:3px solid rgba(217,155,34,.2); }
    .launch strong { display:block; margin-bottom:4px; font-size:18px; }
    .launch span { color:var(--muted); font-size:14px; }
    .privacy { margin:20px 0 0; padding:14px 16px; background:#f4f7f9; border-radius:9px; font-size:13px; }
    footer { margin-top:22px; color:var(--muted); text-align:center; font-size:12px; }
  </style>
</head>
<body>
  <main>
    <header>
      <p>AI Learning・教師工具</p>
      <h1>教師人力與行政架構工具</h1>
    </header>
    <section>
      <h2>選擇工作頁面</h2>
      <p class="intro">可直接進入指定頁面；檔案只在你的瀏覽器內處理，不會上傳。</p>
      <div class="launch-grid">
        <a class="launch" href="teacher-workload/教師人力與行政架構工具_單檔離線版.html#workload">
          <strong>課務與人力安排</strong>
          <span>匯入課務 Excel，整理教師、班別及教擔資料。</span>
        </a>
        <a class="launch" href="teacher-workload/教師人力與行政架構工具_單檔離線版.html#admin">
          <strong>行政架構與專責組別</strong>
          <span>匯入行政架構 PDF，核對組別、從屬、組長及新老師。</span>
        </a>
        <a class="launch" href="teacher-workload/教師人力與行政架構工具_單檔離線版.html#meeting">
          <strong>暑期會議</strong>
          <span>匯入暑期會議 PDF，修訂後下載 CSV／Excel 或複製 TSV。</span>
        </a>
      </div>
      <p class="privacy">三個入口會開啟同一個單檔工具；進入後仍可在上方切換其他頁面。</p>
      <p class="privacy">私有解析原始碼、開發文件及來源資料不在此公開網站。</p>
    </section>
  </main>
</body>
</html>
